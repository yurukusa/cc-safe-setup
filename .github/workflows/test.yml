name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get install -y jq
      - name: Configure git for tests
        run: |
          git config --global user.email "ci@test.com"
          git config --global user.name "CI"
      - name: CLI smoke tests
        run: |
          node index.mjs --help
          node index.mjs --dry-run
      - name: Example hooks syntax check
        run: |
          ERRORS=0
          for f in examples/*.sh; do
            if ! bash -n "$f" 2>/dev/null; then
              echo "SYNTAX ERROR: $f"
              ERRORS=$((ERRORS + 1))
            fi
          done
          echo "$(($(ls examples/*.sh | wc -l) - ERRORS))/$(ls examples/*.sh | wc -l) examples passed syntax check"
          [ "$ERRORS" -eq 0 ] || exit 1
      - name: Full test suite
        run: bash test.sh
      # tests/ holds 234 per-hook suites that nothing ever ran. test.sh does not
      # source them and CI did not call them, so they were 234 test files that
      # could not fail. That is how the marketplace plugins shipped with every
      # block silently disabled whenever jq was missing: the shape was checked,
      # the behaviour was not. Each suite gets its own HOME so state written to
      # ~/.claude by one does not leak into the next, and stdin is closed so a
      # suite that reads a hook's stdin cannot hang the job.
      - name: Per-hook test suites (tests/)
        run: |
          mkdir -p "$HOME/test-homes"
          PASS=0; FAIL=0; FAILED=""
          # 絶対パスで渡す。いくつかの試験は一時ディレクトリへ移ってから
          # "$(dirname "$0")/../examples/…" でフックを呼ぶので、相対パスで
          # 起動すると移った先から解決できず「ファイルが無い」で落ちる。
          for f in "$PWD"/tests/*.sh; do
            TH=$(mktemp -d -p "$HOME/test-homes")
            cp "$HOME/.gitconfig" "$TH/.gitconfig" 2>/dev/null || true
            if HOME="$TH" timeout 180 bash "$f" > "/tmp/$(basename "$f").log" 2>&1 < /dev/null; then
              PASS=$((PASS + 1))
            else
              FAIL=$((FAIL + 1)); FAILED="$FAILED $(basename "$f")"
              echo "::group::FAILED $(basename "$f")"
              tail -40 "/tmp/$(basename "$f").log"
              echo "::endgroup::"
            fi
            rm -rf "$TH"
          done
          echo "tests/: $PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ] || { echo "failing suites:$FAILED"; exit 1; }
      # An unknown key under `hooks` in settings.json is not an error. Claude Code
      # does not warn about it and the hook simply never runs, so one mistyped
      # event name turns a shipped guard into a file that looks installed and
      # protects nothing. Users copy the `# TRIGGER:` line out of the example
      # straight into their settings, and until 2026-08-03 nothing checked those
      # headers: two of them named an event that does not exist.
      - name: Hook TRIGGER headers name real events
        run: python3 scripts/check-hook-event-names.py
      # docs/search-index.json is generated from docs/*.html by
      # scripts/build-search-index.py, and the script has to be run by hand. On
      # 2026-08-03 the checked-in index held 140 entries while docs/ had 208
      # pages: 68 pages — most of the Japanese ones and the diagnostics — were
      # missing from the site's own search, and had been for as long as nobody
      # remembered to run it. Nothing failed, so nothing surfaced. This step
      # regenerates and diffs, so the omission cannot come back silently.
      - name: Generated search index is current
        run: |
          python3 scripts/build-search-index.py
          if ! git diff --quiet -- docs/search-index.json; then
            echo "::error::docs/search-index.json is out of date."
            echo "Run: python3 scripts/build-search-index.py  and commit the result."
            git diff --stat -- docs/search-index.json
            exit 1
          fi
          echo "docs/search-index.json matches docs/*.html ($(python3 -c '
          import json; print(len(json.load(open("docs/search-index.json"))))
          ') entries)"

      # docs/sitemap.xml had the same problem as search-index.json, found on
      # 2026-08-17: it listed 189 URLs while docs/ held 213 pages. The 24 missing
      # ones included the Japanese landing pages for all three paid audits and the
      # six free preview chapters for the monthly. A Google site: query returned
      # results for pages that were in the sitemap and "no results" for the ones
      # that were not, with the same query shape as control — so a page left out
      # of the sitemap was, in practice, a page search could not find.
      - name: Generated sitemap is current
        run: |
          python3 scripts/build-sitemap.py
          if ! git diff --quiet -- docs/sitemap.xml; then
            echo "::error::docs/sitemap.xml is out of date."
            echo "Run: python3 scripts/build-sitemap.py  and commit the result."
            git diff --stat -- docs/sitemap.xml
            exit 1
          fi
          echo "docs/sitemap.xml matches docs/**/*.html ($(grep -c '<loc>' docs/sitemap.xml) URLs)"
