name: 【受付を終了しました】法人向けサービスのご相談
description: 安全監査・チーム研修・導入支援・月額の保守・コンサルの受付は終了しました。いま使えるものをご案内します。
title: "[受付終了] このフォームは閉じています"
labels: ["service", "closed-intake"]
body:
  - type: markdown
    attributes:
      value: |
        ## このフォームの受付は終了しました

        安全監査・チーム研修・導入支援・月額の運用保守・スポットのコンサルは、
        いずれも人が継続して手を動かす形の提供です。その体制を責任を持って用意できないため、
        **2026年8月をもって受け付けを終了しました。**

        以前このフォームを見て検討されていた方には、お詫びします。
        フォームを開けたままにして、お応えできないご相談をいただくのは失礼だと考え、閉じました。

        ### 書面の監査3件は、いまも受け付けています

        止めたのは「人が継続して手を動かす形」です。書面の監査はその形ではないので続けています。
        いずれも非同期で、通話も打ち合わせもなく、こちらがあなたの環境で何かを実行することもありません。
        注文と依頼を日本語で書いていただければ、報告書も日本語でお返しします。

        - **CLAUDE.md 監査**（¥3,980・48時間）— 指示ファイルを読む
          → https://yurukusa.github.io/cc-safe-setup/claude-md-audit-jp.html
        - **Token Burn 監査**（¥3,980・48時間）— セッションの記録と `/cost` の出力を読む
          → https://yurukusa.github.io/cc-safe-setup/token-burn-audit-jp.html
        - **Full-Surface 監査**（¥29,800・72時間）— `CLAUDE.md`・`settings.json`・hook・セッションの記録・
          CI の設定の5層を互いに突き合わせて、層と層の「あいだ」にしか現れない矛盾だけを報告する
          → 見本（自分の設定に実際に走らせた実物）https://github.com/yurukusa/cc-safe-setup/blob/main/docs/full-surface-audit-sample-jp.md

        注文は https://ko-fi.com/yurukusa/commissions から。
        **セッションの記録や設定を、公開される場所へ貼らないでください。** 非公開の受け渡しの経路をこちらから返します。

        ### いま使えるもの（いずれも問い合わせも注文も要りません）

        - **チーム安全導入パック ¥3,000**（買い切り・即ダウンロード）
          → https://yurukusa.booth.pm/items/8230188
          組織で共有する安全ポリシーの雛形、CI の安全ゲート、実際に報告された事故をもとにした解説
        - **無料のチェックリストと診断**
          → https://yurukusa.github.io/cc-safe-setup/services-jp.html （ページ下部の「無料で、今すぐ始められること」）
        - **hook 本体（MIT・これからも無料）**
          → https://github.com/yurukusa/cc-safe-setup

        ### 不具合の報告・質問は続けて受け付けています

        cc-safe-setup そのものについてのバグ報告、誤検知の報告、使い方の質問は、
        通常の issue と Discussions でこれまでどおり歓迎します。
        このフォームではなく、そちらへお願いします。

        - バグ報告: https://github.com/yurukusa/cc-safe-setup/issues/new?template=1-bug_report.md
        - 誤検知の報告: https://github.com/yurukusa/cc-safe-setup/issues/new?template=2-false_positive.md
        - Discussions: https://github.com/yurukusa/cc-safe-setup/discussions
  - type: checkboxes
    id: acknowledged
    attributes:
      label: 確認
      description: |
        GitHub の issue のフォームは、入力の項目が1つも無いと有効な形式として扱われません
        （案内だけの形にすると、フォームの一覧から消えてしまいます）。
        そのため、この確認の項目だけを残しています。ここから issue を作る必要はありません。
      options:
        - label: 上記の受付終了の案内を読みました（この項目に用はありません。閉じてかまいません）
          required: false
